{% extends 'base.html' %}

{% block contenido %}
<div class="row mt-4 mb-4">
    <div class="col-12 col-md-5">
        <img src="{{ flan.image_url }}" class="img-fluid rounded" alt="{{ flan.name }}">
    </div>
    <div class="col-12 col-md-7">
        <h3>{{ flan.name }}</h3>
        <p>{{ flan.description }}</p>
        <p class="fs-4"><strong>${{ flan.price }}</strong></p>
        {% if flan.is_private %}
            <span class="badge bg-warning text-dark mb-3">Producto exclusivo</span>
        {% else %}
            <span class="badge bg-success mb-3">Disponible al público</span>
        {% endif %}
        <br>
        <a href="{% url 'contacto' %}" class="btn btn-primary mt-2">Consultar por este producto</a>
    </div>
</div>
{% endblock %}
