{% extends 'base.html' %}

{% block contenido %}
<div class="col-12 col-md-6 offset-0 offset-md-3 mt-4 mb-4">
    <h3 class="text-center">Iniciar sesión</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">{{ form.username.label_tag }}</label>
            {{ form.username }}
            <div class="text-danger">{{ form.username.errors }}</div>
        </div>

        <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label">{{ form.password.label_tag }}</label>
            {{ form.password }}
            <div class="text-danger">{{ form.password.errors }}</div>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </div>
    </form>
</div>
{% endblock %}
